# Render.com blueprint. Push this repo, then in Render:
#   New + -> Blueprint -> pick this repo -> it reads render.yaml.
# Fill the env vars marked sync:false in the Render dashboard (they are secret).
services:
  - type: web
    name: usa-leads
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py http
    # no healthCheckPath: the /mcp endpoint requires the Bearer token, so an
    # unauthenticated health check would 401 and mark the deploy unhealthy.
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      # ---- secrets: set these in the Render dashboard ----
      # Mail account is required (sending + reading). Source keys are OPTIONAL:
      # osm + yellowpages sources work with no key at all.
      - key: MAIL_ADDRESS
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: GOOGLE_PLACES_API_KEY   # optional
        sync: false
      - key: YELP_API_KEY            # optional
        sync: false
      # mail servers (Hostinger defaults; change for another provider)
      - key: SMTP_HOST
        value: "smtp.hostinger.com"
      - key: SMTP_PORT
        value: "465"
      - key: IMAP_HOST
        value: "imap.hostinger.com"
      - key: IMAP_PORT
        value: "993"
      - key: MCP_AUTH_TOKEN
        generateValue: true        # Render auto-generates a strong token (fallback)
      # PUBLIC_URL turns on OAuth (what Claude Desktop connectors expect).
      # Must match your Render service URL exactly.
      - key: PUBLIC_URL
        value: "https://usa-leads.onrender.com"
      # ---- sender identity ----
      - key: SENDER_NAME
        value: "Saurabh Bhayana"
      - key: SENDER_CITY
        value: "Jaipur, India"
      - key: BOOKING_LINK
        value: ""
      # ---- safety ----
      - key: DAILY_SEND_CAP
        value: "40"
      - key: FULL_AUTO_REPLY
        value: "false"
      # ---- daily auto-run ----
      - key: AUTO_RUN
        value: "true"
      - key: AUTO_CITY
        value: "Austin TX"
      - key: AUTO_CATEGORY
        value: "plumbers"
      - key: AUTO_SOURCE
        value: "osm"
      - key: AUTO_FIND_LIMIT
        value: "20"
      - key: AUTO_SEND_LIMIT
        value: "20"
      - key: AUTO_HOUR_UTC
        value: "14"
